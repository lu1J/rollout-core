name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/cache@v4
        with:
          path: workspace/maven-repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/*') }}
          restore-keys: maven-${{ runner.os }}-
      - run: mvn -B -ntp clean verify
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: docker compose -f infra/compose.yml config --quiet
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: '**/target/surefire-reports/*'
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/cache@v4
        with:
          path: workspace/maven-repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/*') }}
          restore-keys: maven-${{ runner.os }}-
      - run: docker info
      - run: mvn -B -ntp -pl rolloutcore-server -am -Ptestcontainers verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: '**/target/*-reports/*'
